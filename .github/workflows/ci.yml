name: CI

on:
  push:
    branches: [main, test]
  pull_request:

jobs:
  frontend:
    name: Frontend (tsc + Vitest + embed build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: Build embed bundle
        run: npm run build:embed

      - name: Upload embed artifact
        uses: actions/upload-artifact@v4
        with:
          name: fino-console
          path: dist-embed/
